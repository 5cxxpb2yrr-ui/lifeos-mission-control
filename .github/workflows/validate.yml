name: Validate LifeOS Mission Control
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/functional-navigation-capture]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm test
      - name: Upload mobile Mission Control screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-mobile-screenshot
          path: artifacts/mission-control-mobile.png
          if-no-files-found: ignore
          retention-days: 14
